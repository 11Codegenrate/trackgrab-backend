<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TrackGrab – SoundCloud Downloader</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --brand: #FD5400;
      --bg: #000;
      --card: rgba(255,255,255,0.04);
      --border: #BBBBBB;
      --text: #fff;
      --muted: #4A4A4A;
      --dark-text: #363636;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .container {
      width: 100%;
      max-width: 700px;
    }

    /* ── HEADER ── */
    .header {
      text-align: center;
      margin-bottom: 40px;
    }

    .header h1 {
      font-size: clamp(36px, 7vw, 60px);
      font-weight: 700;
      background: linear-gradient(90deg, #fff, #aaa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.1;
      margin-bottom: 12px;
    }

    .header h1 .brand {
      -webkit-text-fill-color: var(--brand);
    }

    .header h1 .dim {
      -webkit-text-fill-color: #363636;
    }

    .subtitle {
      font-size: 15px;
      color: var(--muted);
    }

    /* ── SERVER CONFIG ── */
    .config-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255,255,255,0.03);
      border: 1px solid #1f1f1f;
      border-radius: 10px;
      padding: 10px 16px;
      margin-bottom: 20px;
    }

    .config-bar label {
      font-size: 11px;
      color: #555;
      letter-spacing: 1px;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .config-bar input {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: var(--brand);
      font-size: 13px;
      font-family: 'Courier New', monospace;
    }

    .config-bar input::placeholder { color: #333; }

    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #333;
      flex-shrink: 0;
      transition: background 0.3s;
    }
    .status-dot.online { background: #4caf50; }
    .status-dot.offline { background: #f44336; }

    /* ── FORM ── */
    .search-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .search-row input {
      flex: 1;
      min-width: 220px;
      padding: 15px 20px;
      font-size: 15px;
      border-radius: 8px;
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--border);
      color: var(--dark-text);
      font-family: 'Inter', sans-serif;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-row input:focus { border-color: var(--brand); }
    .search-row input::placeholder { color: #555; }

    .search-row button {
      padding: 15px 28px;
      font-size: 15px;
      font-weight: 600;
      border-radius: 8px;
      background: var(--brand);
      color: #fff;
      border: none;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .search-row button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(253,84,0,0.35);
    }

    .search-row button:disabled {
      opacity: 0.5; cursor: wait; transform: none;
    }

    /* ── SPINNER ── */
    .spinner {
      display: none;
      justify-content: center;
      align-items: flex-end;
      gap: 4px;
      height: 50px;
      margin: 20px 0;
    }

    .bar {
      width: 4px;
      background: var(--brand);
      border-radius: 2px;
      animation: wave 1s infinite ease-in-out;
    }

    .bar:nth-child(1){height:20%;animation-delay:0s}
    .bar:nth-child(2){height:40%;animation-delay:.1s}
    .bar:nth-child(3){height:60%;animation-delay:.2s}
    .bar:nth-child(4){height:40%;animation-delay:.3s}
    .bar:nth-child(5){height:20%;animation-delay:.4s}

    @keyframes wave {
      0%,100%{transform:scaleY(0.4)}
      50%{transform:scaleY(1)}
    }

    /* ── ERROR ── */
    .error {
      display: none;
      background: rgba(244,67,54,0.08);
      border: 1px solid rgba(244,67,54,0.25);
      border-radius: 8px;
      padding: 12px 16px;
      color: #ef5350;
      font-size: 13px;
      margin-bottom: 16px;
    }

    /* ── TRACK CARD ── */
    .track-card {
      display: none;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      animation: fadeUp 0.4s ease;
    }

    .track-inner {
      display: flex;
      gap: 20px;
      align-items: flex-start;
    }

    .track-card img {
      width: 120px;
      height: 120px;
      border-radius: 10px;
      object-fit: cover;
      flex-shrink: 0;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    .track-placeholder {
      width: 120px; height: 120px;
      border-radius: 10px;
      background: rgba(253,84,0,0.1);
      display: flex; align-items: center;
      justify-content: center; font-size: 36px;
      flex-shrink: 0;
    }

    .track-meta { flex: 1; min-width: 0; }

    .track-title {
      font-size: 17px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 4px;
      line-height: 1.3;
    }

    .track-artist {
      font-size: 13px;
      color: #888;
      margin-bottom: 10px;
    }

    .track-stats {
      display: flex;
      gap: 14px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .stat {
      font-size: 12px;
      color: #555;
    }

    .track-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn-download {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 11px 20px;
      background: var(--brand);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      text-decoration: none;
      transition: all 0.2s;
    }

    .btn-download:hover {
      background: #e64d00;
      transform: translateY(-1px);
    }

    .btn-cover {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 11px 20px;
      background: rgba(255,255,255,0.06);
      color: #aaa;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      transition: all 0.2s;
    }

    .btn-cover:hover {
      border-color: #555;
      color: #fff;
    }

    .btn-reset {
      margin-top: 16px;
      width: 100%;
      padding: 10px;
      background: none;
      border: 1px solid #1f1f1f;
      border-radius: 8px;
      color: #444;
      font-size: 13px;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      transition: all 0.2s;
    }

    .btn-reset:hover { border-color: #333; color: #888; }

    /* ── FOOTER ── */
    .footer {
      text-align: center;
      margin-top: 30px;
      font-size: 11px;
      color: #222;
      letter-spacing: 1px;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 500px) {
      .track-inner { flex-direction: column; align-items: center; text-align: center; }
      .track-stats { justify-content: center; }
      .track-actions { justify-content: center; }
    }
  </style>
</head>
<body>
<div class="container">

  <!-- Header -->
  <div class="header">
    <h1><span class="brand">SoundCloud</span> <span class="dim">to MP3</span></h1>
    <p class="subtitle">Paste any SoundCloud track link and download as MP3</p>
  </div>

  <!-- Server config -->
  <div class="config-bar">
    <span class="status-dot" id="statusDot"></span>
    <label>YOUR SERVER →</label>
    <input type="text" id="serverInput"
      placeholder="https://your-app.onrender.com"
      oninput="saveServer()" />
  </div>

  <!-- Search -->
  <div class="search-row">
    <input type="text" id="urlInput"
      placeholder="https://soundcloud.com/artist/track-name"
      onkeydown="if(event.key==='Enter') fetchInfo()" />
    <button id="fetchBtn" onclick="fetchInfo()">Get Track</button>
  </div>

  <!-- Error -->
  <div class="error" id="errorBox"></div>

  <!-- Spinner -->
  <div class="spinner" id="spinner">
    <div class="bar"></div><div class="bar"></div>
    <div class="bar"></div><div class="bar"></div>
    <div class="bar"></div>
  </div>

  <!-- Track result -->
  <div class="track-card" id="trackCard">
    <div class="track-inner">
      <div id="artworkWrap"></div>
      <div class="track-meta">
        <div class="track-title" id="trackTitle"></div>
        <div class="track-artist" id="trackArtist"></div>
        <div class="track-stats" id="trackStats"></div>
        <div class="track-actions" id="trackActions"></div>
      </div>
    </div>
    <button class="btn-reset" onclick="reset()">← Search another track</button>
  </div>

  <p class="footer">POWERED BY YOUR OWN SERVER · PERSONAL USE ONLY</p>
</div>

<script>
  const SERVER_KEY = 'trackgrab_server';
  let currentTrack = null;

  // Load saved server URL
  window.addEventListener('DOMContentLoaded', () => {
    const saved = localStorage.getItem(SERVER_KEY);
    if (saved) {
      document.getElementById('serverInput').value = saved;
      checkServer(saved);
    }
  });

  function saveServer() {
    const val = document.getElementById('serverInput').value.trim();
    localStorage.setItem(SERVER_KEY, val);
    if (val) checkServer(val);
  }

  async function checkServer(url) {
    const dot = document.getElementById('statusDot');
    dot.className = 'status-dot';
    try {
      const res = await fetch(url.replace(/\/$/, '') + '/');
      dot.className = res.ok ? 'status-dot online' : 'status-dot offline';
    } catch {
      dot.className = 'status-dot offline';
    }
  }

  function getServer() {
    return (document.getElementById('serverInput').value.trim()).replace(/\/$/, '');
  }

  function showError(msg) {
    const el = document.getElementById('errorBox');
    el.textContent = '⚠ ' + msg;
    el.style.display = 'block';
  }

  function hideError() {
    document.getElementById('errorBox').style.display = 'none';
  }

  function setLoading(on) {
    document.getElementById('spinner').style.display = on ? 'flex' : 'none';
    document.getElementById('fetchBtn').disabled = on;
    document.getElementById('fetchBtn').textContent = on ? 'Fetching...' : 'Get Track';
  }

  async function fetchInfo() {
    const server = getServer();
    const url = document.getElementById('urlInput').value.trim();

    hideError();
    document.getElementById('trackCard').style.display = 'none';

    if (!server) { showError('Please enter your Render server URL first.'); return; }
    if (!url) { showError('Please paste a SoundCloud track URL.'); return; }
    if (!url.includes('soundcloud.com')) { showError('Please enter a valid SoundCloud URL.'); return; }

    setLoading(true);

    try {
      const res = await fetch(`${server}/info?url=${encodeURIComponent(url)}`);
      if (!res.ok) throw new Error(`Server error: ${res.status}`);
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      currentTrack = data;
      renderTrack(data, server, url);
    } catch (e) {
      showError(e.message || 'Failed to fetch track. Is your server running?');
    } finally {
      setLoading(false);
    }
  }

  function renderTrack(track, server, originalUrl) {
    // Artwork
    const artWrap = document.getElementById('artworkWrap');
    if (track.thumbnail) {
      artWrap.innerHTML = `<img src="${track.thumbnail}" alt="artwork" />`;
    } else {
      artWrap.innerHTML = `<div class="track-placeholder">♪</div>`;
    }

    document.getElementById('trackTitle').textContent = track.title;
    document.getElementById('trackArtist').textContent = track.uploader || '';

    // Stats
    const dur = track.duration ? formatDuration(track.duration) : '';
    const plays = track.view_count ? '▶ ' + track.view_count.toLocaleString() : '';
    const likes = track.like_count ? '♥ ' + track.like_count.toLocaleString() : '';
    document.getElementById('trackStats').innerHTML =
      [dur, plays, likes].filter(Boolean).map(s => `<span class="stat">${s}</span>`).join('');

    // Download link
    const dlUrl = `${server}/download?url=${encodeURIComponent(originalUrl)}&title=${encodeURIComponent(track.title)}`;
    document.getElementById('trackActions').innerHTML = `
      <a class="btn-download" href="${dlUrl}" download>
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <path d="M12 5v14m0 0l-6-6m6 6l6-6"/>
        </svg>
        Download MP3
      </a>
      ${track.thumbnail ? `
      <button class="btn-cover" onclick="downloadCover('${track.thumbnail}', '${track.title.replace(/'/g,"\\'")}')">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <circle cx="8.5" cy="8.5" r="1.5"/>
          <path d="M21 15l-5-5L5 21"/>
        </svg>
        Save Cover
      </button>` : ''}
    `;

    document.getElementById('trackCard').style.display = 'block';
  }

  function formatDuration(secs) {
    const m = Math.floor(secs / 60);
    const s = secs % 60;
    return `${m}:${String(s).padStart(2,'0')}`;
  }

  async function downloadCover(url, title) {
    try {
      const res = await fetch(url);
      const blob = await res.blob();
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = title + '.jpg';
      a.click();
      URL.revokeObjectURL(a.href);
    } catch {
      alert('Could not download cover image.');
    }
  }

  function reset() {
    document.getElementById('urlInput').value = '';
    document.getElementById('trackCard').style.display = 'none';
    hideError();
    currentTrack = null;
    document.getElementById('urlInput').focus();
  }
</script>
</body>
</html>
